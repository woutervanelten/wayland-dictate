# Bouwt de AppImage in een ubuntu:22.04-container (glibc 2.35 = oudste nog
# ondersteunde LTS) zodat het artefact voldoet aan appimage.github.io en op
# oudere distro's draait. Publiceert het resultaat als release-asset.
name: Build AppImage

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  appimage:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    permissions:
      contents: write
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Systeemvereisten (git nodig vóór checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates jq binutils squashfs-tools \
            libasound2 libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0

      - uses: actions/checkout@v4

      - name: uv installeren
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versie en release bepalen
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"                 # bijv. V1.0.1
            VERSION="${TAG#V}"; VERSION="${VERSION#v}"
          else
            # Handmatige run: versie uit pyproject, upload naar de nieuwste release
            VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
            TAG=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: AppImage bouwen (oude glibc-basis)
        run: VERSION="${{ steps.meta.outputs.version }}" bash packaging/build_appimage.sh

      - name: Controleren dat niets nieuws dan glibc 2.35 vereist is
        run: |
          BAD=0
          for f in $(find dist/wayland-dictate -type f \( -name "*.so*" -o -perm -u+x \)); do
            v=$(objdump -T "$f" 2>/dev/null | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -uV | tail -1)
            case "$v" in GLIBC_2.3[6-9]*|GLIBC_[3-9]*) echo "TE NIEUW: $v in $f"; BAD=1;; esac
          done
          [ "$BAD" = 0 ] && echo "glibc-eis OK (<= 2.35)"

      - name: Assets op de release plaatsen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          if [ -n "${{ steps.meta.outputs.tag }}" ]; then
            REL=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API}/releases/tags/${{ steps.meta.outputs.tag }}")
          else
            REL=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/latest")
          fi
          REL_ID=$(echo "$REL" | jq -r .id)
          UPLOAD_URL=$(echo "$REL" | jq -r .upload_url | sed 's/{.*}//')
          for f in dist/WaylandLiveDictate-*-x86_64.AppImage dist/*.zsync; do
            name=$(basename "$f")
            # bestaande asset met dezelfde naam verwijderen (opnieuw bouwen kan)
            IDS=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API}/releases/${REL_ID}/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id')
            for id in $IDS; do
              curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "${API}/releases/assets/${id}" >/dev/null || true
            done
            echo "Uploaden: $name"
            curl -sf -X POST --data-binary "@${f}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=${name}" >/dev/null
          done
          echo "Klaar: assets bijgewerkt op release ${REL_ID}"
