[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wayland-dictate"
version = "1.0.1"
description = "Live streaming dictation and translation for Wayland powered by Lemonade AI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.14",
    "PySide6>=6.7.0",
]

[project.scripts]
wayland-dictate = "wayland_dictate.app:main"

[tool.setuptools.packages.find]
where = ["src"]
